name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install GStreamer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Install GStreamer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # GStreamer 1.28+ ships the MSVC build as a single Inno Setup .exe
          # (runtime + development), and older releases are pruned from the
          # server, so pin a current stable release and install the devel type
          # into a writable, fixed location.
          $v = "1.28.9"
          $gst = "D:\gstreamer\1.0\msvc_x86_64"
          $url = "https://gstreamer.freedesktop.org/data/pkg/windows/$v/msvc/gstreamer-1.0-msvc-x86_64-$v.exe"
          $exe = "$env:RUNNER_TEMP\gstreamer-$v.exe"
          Invoke-WebRequest $url -OutFile $exe
          Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TYPE=devel',"/DIR=$gst" -Wait -NoNewWindow
          if (-not (Test-Path "$gst\lib\pkgconfig\gstreamer-1.0.pc")) {
            throw "GStreamer devel install missing at $gst"
          }
          # gstreamer-rs's -sys build resolves libs through pkg-config; install
          # a standalone pkg-config-lite so the lookup works on the runner.
          choco install pkgconfiglite -y --no-progress --limit-output
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gst" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$gst\lib\pkgconfig" >> $env:GITHUB_ENV
          "$gst\bin" >> $env:GITHUB_PATH

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      - name: build release
        run: cargo build --release
