name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install GStreamer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Install GStreamer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Since 1.28 the Windows MSVC package is a single Inno Setup .exe
          # (runtime + development in one), and old releases are pruned from the
          # server, so pin a current stable release and install the devel type.
          $v = "1.28.9"
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$v/msvc"
          $exe = "$env:RUNNER_TEMP\gstreamer-$v.exe"
          Invoke-WebRequest "$base/gstreamer-1.0-msvc-x86_64-$v.exe" -OutFile $exe
          & $exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /TYPE=devel "/DIR=C:\gstreamer\1.0\msvc_x86_64"
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=C:\gstreamer\1.0\msvc_x86_64" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=C:\gstreamer\1.0\msvc_x86_64\lib\pkgconfig" >> $env:GITHUB_ENV
          "C:\gstreamer\1.0\msvc_x86_64\bin" >> $env:GITHUB_PATH

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      - name: build release
        run: cargo build --release
