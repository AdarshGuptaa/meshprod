[package]
name = "sfm2mesh"
version = "0.1.0"
edition = "2021"
description = "Monocular video -> sparse SfM -> dense MVS -> simplified textured mesh"
publish = false

[dependencies]
argh = "0.1"
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tower-http = { version = "0.6", features = ["fs"] }
cudarc = "0.19"
kiddo = "5.3"
kornia-3d = { git = "https://github.com/AdarshGuptaa/kornia-rs.git", branch = "semproj/sfm2mesh" }
kornia-algebra = { git = "https://github.com/AdarshGuptaa/kornia-rs.git", branch = "semproj/sfm2mesh" }
kornia-calib = { git = "https://github.com/AdarshGuptaa/kornia-rs.git", branch = "semproj/sfm2mesh" }
kornia-image = { git = "https://github.com/AdarshGuptaa/kornia-rs.git", branch = "semproj/sfm2mesh", features = ["cuda"] }
kornia-imgproc = { git = "https://github.com/AdarshGuptaa/kornia-rs.git", branch = "semproj/sfm2mesh", features = ["cuda"] }
kornia-io = { git = "https://github.com/AdarshGuptaa/kornia-rs.git", branch = "semproj/sfm2mesh", features = ["gstreamer"] }
rayon = "1.12"

[dev-dependencies]
tempfile = "3.27"

# Pinned to the fork branch that carries the SFM work (PR #1136). For local
# iteration, add an uncommitted [patch] block pointing at a checkout; see the
# README's "Dependency note".
